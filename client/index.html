<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8" />

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    />

    <title>Lily AI Avatar</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {

            width: 100%;
            height: 100%;

            overflow: hidden;

            background:
                radial-gradient(
                    circle at top,
                    #1b1f3a,
                    #0b0e1c 70%
                );

            font-family:
                Arial,
                sans-serif;
        }
    #user-input {
      flex: 1;
      padding: 12px 15px;
      border: 1px solid #ddd;
      border-radius: 24px;
      outline: none;
      font-size: 16px;
}

        #live2d-canvas {

            position: fixed;

            width: 100%;
            height: 100%;

            top: 0;
            left: 0;

            z-index: 1;
        }

        #status {

            position: fixed;

            top: 20px;
            left: 20px;

            color: white;

            background:
                rgba(0,0,0,0.5);

            padding:
                12px 18px;

            border-radius: 14px;

            backdrop-filter: blur(10px);

            z-index: 999;
        }

        #controls {

            position: fixed;

            bottom: 25px;
            left: 50%;

            transform:
                translateX(-50%);

            display: flex;

            gap: 12px;

            background:
                rgba(0,0,0,0.5);

            padding:
                14px 20px;

            border-radius: 20px;

            backdrop-filter: blur(10px);

            z-index: 999;
        }

        button {

            border: none;

            cursor: pointer;

            color: white;

            background:
                linear-gradient(
                    135deg,
                    #5c6cff,
                    #7d4dff
                );

            padding:
                10px 18px;

            border-radius: 12px;

            transition: 0.2s;
        }

        button:hover {

            transform:
                translateY(-2px);
        }

    </style>

</head>

<body>

    <canvas id="live2d-canvas"></canvas>

    <div id="status">

        Initializing Lily...

    </div>

    <div id="controls">

 <input type="text" id="user-input" placeholder="Type your message..." autocomplete="on">


    </div>

    <!-- PIXI -->

    <script src="./js/libs/pixi.min.js"></script>

    <!-- LIVE2D CORE -->

    <script src="./js/libs/live2dcubismcore.min.js"></script>

    <!-- LIVE2D -->

    <script src="./js/libs/pixi-live2d-cubism4.min.js"></script>

    <!-- MAIN APP -->

    <script
        type="module"
        src="./js/app.js"
    ></script>

</body>

</html>
